name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  admission-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Coupling + manifest gate
        run: sh scripts/check-coupling.sh

      - name: Shellcheck plugin + repo scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck -S warning

      - name: Validate JSON manifests
        run: |
          find . \( -name 'plugin.json' -o -name 'marketplace.json' \) -not -path './.git/*' -print0 \
            | xargs -0 -I{} sh -c 'python3 -m json.tool "{}" >/dev/null && echo "ok {}"'

      - name: Node unit tests (plugin scripts)
        run: |
          tests=$(find plugins -name '*.test.mjs' -not -path '*/node_modules/*')
          if [ -n "$tests" ]; then
            # shellcheck disable=SC2086
            node --test $tests
          else
            echo "no *.test.mjs found — skipping"
          fi

      # The runner's own Python refuses package installs outside a virtual environment; this one
      # does not, and it pins the interpreter the tests run on.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python unit tests (plugins that declare CI requirements)
        run: |
          found=0
          for req in plugins/*/tests/requirements-ci.txt; do
            [ -f "$req" ] || continue
            found=1
            plugin_dir=$(dirname "$(dirname "$req")")
            python -m pip install --quiet -r "$req"
            python -B -m unittest discover -s "$plugin_dir/tests"
          done
          [ "$found" -eq 1 ] || echo "no plugin declares tests/requirements-ci.txt — skipping"
